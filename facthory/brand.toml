# Facthory Deck: upstream DeckCraft (storytold/deckcraft) under the Facthory brand.
# Applied to a fresh checkout by facthory/rebrand.py before every build; the tracked tree stays
# upstream's so releases merge cleanly. Order and semantics: the docstring of rebrand.py.

[brand]
name = "Facthory Deck"
app_id = "com.facthory.deck"
publisher = "Bandpey GmbH"
website = "https://facthory.com/deck"
repository = "https://github.com/FACTHORYAI/deck"
support = "https://github.com/FACTHORYAI/deck/issues"

[upstream]
name = "DeckCraft"
team = "ArtCraft team"
repository = "https://github.com/storytold/deckcraft"

[icon]
# The glyph is deck.svg, unchanged; facthory/icons/fit.py places it: deck-macos.svg (Apple's grid) and
# deck-flat.svg (Windows, Linux, the scalable icon). render.py renders the platform files from those.
glyph = "deck.svg"
svg = "deck-flat.svg"
base = "facthorydeck"
macos_svg = "deck-macos.svg"
author = "with icons contributors; recoloured by Bandpey GmbH"
source = "`presentation` in with icons' Chrome style (https://github.com/withevergrow/withicons at 996cc78), recoloured to the Deck colours"
licence = "MIT"
# The licence text, written at the end of ATTRIBUTION.md's Facthory block. The packages ship NOTICE,
# not ATTRIBUTION.md, so a rule further down appends the same text to NOTICE.
notice = "LICENSE-withicons.txt"
# Upstream's assets/app-icon/ has neither <base>-macos-512.png nor <base>.svg.
macos_512 = false
svg_copy = false
note = """Facthory's marks (`facthory/icons/brand/`, and the two renders of them in `app-icon/` that the About box draws) are the brand of Bandpey GmbH, copied unmodified from the Facthory Design System. They are not open source and not covered by this project's MIT OR Apache-2.0 licence: they may be used unmodified only, to name Facthory's own builds, and a logo is never recoloured, stretched, cropped or redrawn. They are not in the app icons."""

# Facthory's other asset files, credited in ATTRIBUTION.md's Facthory block (render.py).
[[asset]]
path = "dmg/background.svg"
author = "@XusBadia (DeckCraft contributors); recoloured and retitled by Bandpey GmbH"
source = "derived from DeckCraft's `packaging/macos/dmg/background.svg`; title outlined from Inter SemiBold (OFL-1.1)"
licence = "MIT OR Apache-2.0"

[[asset]]
path = "icons/brand/mark.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark, for light grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/mark-mono.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark in white and greys, for dark grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/mark.png"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark, 960 x 1016 pixels), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the mark beside the name), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark-only.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the lettering alone), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/brand/word-mark-only-mono.svg"
author = "Bandpey GmbH"
source = "Facthory's logo (the lettering alone, for dark grounds), copied unmodified from the Facthory Design System"
licence = "Facthory trademark, all rights reserved: not open source; usable unmodified only"

[[asset]]
path = "icons/proof/deck.png"
author = "Bandpey GmbH"
source = "contact sheet of the icon candidates beside reference shapes, drawn by `facthory/icons/proof.py`; contains Facthory's mark"
licence = "MIT OR Apache-2.0, except Facthory's mark in it: trademark of Bandpey GmbH"

[files]
# Names fixed inside binary fixtures, which the text naming them must keep matching: the test
# fonts' family names (crates/render/tests/fixtures/colr-squares.ttf,
# crates/fonts/tests/fixtures/legacy-*.ttf). Tests only.
keep = ["DeckCraft Colr Squares", "DeckCraft Legacy"]
# Tokens never touch these: upstream's licences and notices stay as written (Apache-2.0 §4). NOTICE
# only gains an addendum at its end, for the app icon's licence (rule below; §4(d) allows it).
skip = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE", ".github"]
# Credit files. No token here applies to them (none is credits = true): contributors.json names
# upstream's repository on purpose, and ATTRIBUTION.md's icon rows are rewritten by the rules
# below, so every other credit stays exactly as upstream wrote it.
credits = ["ATTRIBUTION.md", "contributors"]
# The ArtCraft marks, licensed only for unmodified DeckCraft (docs/brand/LICENSE-brand.txt).
delete = ["docs/brand"]

# ---------------------------------------------------------------------------------------------
# Rules before the tokens, on upstream's text. Each fails the build when upstream moves it.

[[rule]]
why = "ProgIDs, the AppDir and other dotted names cannot take the space in the display name"
files = ["packaging/*", "apps/*"]
find = 'DeckCraft\.(?=[A-Z])'
replace = 'FacthoryDeck.'
regex = true

[[rule]]
why = "Info.plist keys that glue the name to a word"
files = "packaging/macos/Info.plist.in"
find = 'DeckCraft(?=Version|BuildCommit)'
replace = 'FacthoryDeck'
regex = true
count = 2

[[rule]]
why = "The ArtCraft Discord becomes our issue tracker: Help tab and About links"
files = ["crates/ui-egui/src/dialogs/about.rs", "crates/ui-egui/src/backstage/info.rs"]
find = 'ui.hyperlink_to("Join our community on Discord", '
replace = 'ui.hyperlink_to("Report a problem or ask for help", '
count = 2

[[rule]]
why = "File backstage: the ArtCraft community link"
files = "crates/ui-egui/src/backstage/files.rs"
find = 'ui.hyperlink_to("Join the ArtCraft community on Discord", '
replace = 'ui.hyperlink_to("Report a problem or ask for help", '
count = 1

[[rule]]
why = "CLI `links`: the Discord line is our issue tracker"
files = "apps/deckcraft-cli/src/main.rs"
find = 'outln!("Discord   {DISCORD}\nWebsite   {WEBSITE}\nApp page  {APP_PAGE}\nGitHub    {GITHUB}");'
replace = 'outln!("Support   {DISCORD}\nWebsite   {WEBSITE}\nApp page  {APP_PAGE}\nGitHub    {GITHUB}");'
count = 1

[[rule]]
files = "apps/deckcraft-cli/src/main.rs"
find = 'eprintln!("\nCommunity: {}  ·  {}", deckcraft_engine::links::DISCORD, deckcraft_engine::links::APP_PAGE);'
replace = 'eprintln!("\nHelp: {}  ·  {}", deckcraft_engine::links::DISCORD, deckcraft_engine::links::APP_PAGE);'
count = 1

[[rule]]
why = "MCP server instructions name the issue tracker, not Discord"
files = "crates/mcp/src/server.rs"
find = 'Community: {} (Discord), {} (app page), {} (source).'
replace = 'Support: {} (issues), {} (app page), {} (source).'
count = 1

[[rule]]
why = "Upstream's mark painted in code (About, Start screen, Account page) becomes Facthory's mark, in the theme's variant"
files = "crates/ui-egui/src/dialogs/about.rs"
find = '''(?s)/// DeckCraft's mark, drawn in code: a slide card with a play triangle in our orange\.\npub fn paint_logo\(p: &egui::Painter, r: Rect\) \{\n.*?\n\}\n'''
replace = '''/// Facthory's mark, painted from its renders (facthory/icons/brand/mark.svg on a light theme, mark-mono.svg
/// on a dark one) in its own proportions, centred in `r`. Each texture is made once and kept in the
/// context's memory.
pub fn paint_logo(p: &egui::Painter, r: Rect) {
    const LIGHT: &[u8] = include_bytes!("../../../../assets/app-icon/facthorydeck-logo-light.png");
    const DARK: &[u8] = include_bytes!("../../../../assets/app-icon/facthorydeck-logo-dark.png");
    let ctx = p.ctx();
    let dark = ctx.style().visuals.dark_mode;
    let id = egui::Id::unique(if dark { "facthory-deck-logo-dark" } else { "facthory-deck-logo-light" });
    let tex = ctx.data(|d| d.get_temp::<egui::TextureHandle>(id)).or_else(|| {
        let img = deckcraft_render::decode_image(if dark { DARK } else { LIGHT })?;
        let size = [img.width() as usize, img.height() as usize];
        let tex = ctx.load_texture(if dark { "facthory-deck-logo-dark" } else { "facthory-deck-logo-light" }, egui::ColorImage::from_rgba_unmultiplied(size, img.as_raw()), egui::TextureOptions::LINEAR);
        ctx.data_mut(|d| d.insert_temp(id, tex.clone()));
        Some(tex)
    });
    if let Some(tex) = tex {
        let size = tex.size_vec2();
        if size.x > 0.0 && size.y > 0.0 {
            let fit = Rect::from_center_size(r.center(), size * (r.width() / size.x).min(r.height() / size.y));
            p.image(tex.id(), fit, Rect::from_min_max(pos2(0.0, 0.0), pos2(1.0, 1.0)), Color32::WHITE);
        }
    }
}
'''
regex = true
count = 1

[[rule]]
why = "macOS: the CLI goes inside the app, beside the app's own executable, so a Facthory agent finds the MCP server where the app is installed (W5); the Windows and Linux installers already carry it"
files = "packaging/macos/package.sh"
find = '''
cp "$WORK/bin/deckcraft" "$APP/Contents/MacOS/DeckCraft"
'''
replace = '''
cp "$WORK/bin/deckcraft" "$APP/Contents/MacOS/DeckCraft"
cp "$WORK/bin/deckcraft-cli" "$APP/Contents/MacOS/deckcraft-cli"
'''
count = 1

[[rule]]
why = "... signed with the hardened runtime before the bundle, as nested code is"
files = "packaging/macos/package.sh"
find = '''
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/DeckCraft"
'''
replace = '''
sign --options runtime "$APP/Contents/MacOS/deckcraft-cli"
sign --options runtime --entitlements "$HERE/entitlements.plist" "$APP/Contents/MacOS/DeckCraft"
'''
count = 1

[[rule]]
why = "Windows: the installer's suite folder (Programs\\ArtCraft\\<app>, Program Files\\ArtCraft\\<app>) is ours, and the installer's own policy check expects the same name"
files = ["packaging/windows/*.wxs", "packaging/windows/*.wxi", "packaging/windows/*.ps1", "packaging/windows/*.md"]
find = "ArtCraft"
replace = "Facthory"

# Windows signing runs in CI only, through GitHub's OIDC token (the owner's rule, 2026-10-31): the
# release workflow signs in to Azure with azure/login, so no client secret exists anywhere, and
# Artifact Signing's library takes that sign-in from the Azure CLI. facthory-release.yml says so
# with AZURE_SIGNING_OIDC=1; without it, upstream's paths are unchanged.

[[rule]]
why = "Windows signing through OIDC: Artifact Signing needs only its endpoint, account and profile"
files = "packaging/windows/sign.ps1"
find = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
"""
replace = """
$azureVars = 'AZURE_TENANT_ID', 'AZURE_CLIENT_ID', 'AZURE_CLIENT_SECRET', 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE'
if ($env:AZURE_SIGNING_OIDC -eq '1') { $azureVars = 'AZURE_SIGNING_ENDPOINT', 'AZURE_SIGNING_ACCOUNT', 'AZURE_CERT_PROFILE' }
"""
count = 1

[[rule]]
why = "... and the signing library tries the Azure CLI's sign-in alone, not the runner's other identities"
files = "packaging/windows/sign.ps1"
find = """
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
replace = """
    } | ForEach-Object {
      if ($env:AZURE_SIGNING_OIDC -eq '1') {
        $_.ExcludeCredentials = @('EnvironmentCredential', 'WorkloadIdentityCredential', 'ManagedIdentityCredential', 'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential', 'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
      }
      $_
    } | ConvertTo-Json | Set-Content -Path $metadata -Encoding utf8
"""
count = 1

# The Flatpak recipes name the shared updater's version folder under the ArtCraft name; our builds
# leave that updater out (craft-update, above), so the folder goes. The update permissions stay:
# upstream's test requires them (crates/ui-egui/tests/flatpak_updates.rs) and they name nobody.
[[rule]]
why = "The Flatpak recipes drop the shared updater's ArtCraft folder"
files = ["packaging/linux/flatpak/ai.storyteller.deckcraft.yml", "packaging/linux/flatpak/ai.storyteller.deckcraft.bundle.yml"]
find = "  - --filesystem=xdg-data/ArtCraft/versions:ro\n"
replace = ""
count = 2

[[rule]]
why = "The Flatpak image push names a fallback user: ours"
files = "packaging/linux/flatpak-oci.sh"
find = "${GITHUB_ACTOR:-storytold}"
replace = "${GITHUB_ACTOR:-facthory}"
count = 1

# Upstream's HEVC decoder trips a lint that Rust 1.100's clippy added (needless_bool), and the
# shared gate denies warnings. Upstream replaced this whole crate with craft-video after the
# release we merge, so there is no fix of theirs to take; the guard keeps its shape and says why.
[[rule]]
why = "Rust 1.100 clippy: the deblocking guard's last condition"
files = "crates/hevc/src/filter.rs"
find = """
        if !pic.pps.loop_filter_across_tiles && pic.layout.tile_id[pic.layout.rs_to_ts[nrs] as usize] != pic.layout.tile_id[cur_ts as usize] {
            return false;
        }
        true
"""
replace = """
        // The remaining tile check, written as the value it yields (clippy::needless_bool, 1.100).
        !(!pic.pps.loop_filter_across_tiles && pic.layout.tile_id[pic.layout.rs_to_ts[nrs] as usize] != pic.layout.tile_id[cur_ts as usize])
"""
count = 1

# Notarization with the App Store Connect API key of Bandpey GmbH's other releases, not an Apple
# account's app-specific password: package.sh reads the key's file, id and issuer (the release
# workflow writes the .p8 under $RUNNER_TEMP, mode 600, and removes it again).
[[rule]]
why = "Notarization takes an API key: the script's header"
files = "packaging/macos/package.sh"
find = '''# Notarization (env; all three needed, and a real identity):
#   APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
'''
replace = '''# Notarization (env; all three needed, and a real identity), with an App Store Connect API key:
#   NOTARY_KEY_FILE (the .p8), NOTARY_KEY_ID, NOTARY_ISSUER
'''
count = 1

[[rule]]
why = "... the condition"
files = "packaging/macos/package.sh"
find = '''elif [[ -n "${APPLE_ID:-}" ]] && [[ -n "${APPLE_PASSWORD:-}" ]] && [[ -n "${APPLE_TEAM_ID:-}" ]]; then
  NOTARIZE=1
else
  warn "macOS: APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID incomplete; signed but not notarized"
fi
'''
replace = '''elif [[ -f "${NOTARY_KEY_FILE:-}" ]] && [[ -n "${NOTARY_KEY_ID:-}" ]] && [[ -n "${NOTARY_ISSUER:-}" ]]; then
  NOTARIZE=1
else
  warn "macOS: NOTARY_KEY_FILE / NOTARY_KEY_ID / NOTARY_ISSUER incomplete; signed but not notarized"
fi
'''
count = 1

[[rule]]
why = "... the submission"
files = "packaging/macos/package.sh"
find = '''  out="$(xcrun notarytool submit "$file" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
    --team-id "$APPLE_TEAM_ID" --wait --timeout 1h --output-format json)" || true
'''
replace = '''  out="$(xcrun notarytool submit "$file" --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" \
    --issuer "$NOTARY_ISSUER" --wait --timeout 1h --output-format json)" || true
'''
count = 1

[[rule]]
why = "... and the log of a refusal"
files = "packaging/macos/package.sh"
find = '''      xcrun notarytool log "$id" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" || true
'''
replace = '''      xcrun notarytool log "$id" --key "$NOTARY_KEY_FILE" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" || true
'''
count = 1

# Upstream's own updater (craft-update, from craft-libs) checks and installs the upstream apps'
# releases, by their repositories and ai.storyteller.* ids, and carries their names into the binary.
# It is left out: facthory/update/ is the updater that runs, and facthory/update/updates_ui.rs
# stands in for upstream's update window ([[copy]] below).

[[rule]]
why = "No self-update helper of upstream's flow at start"
files = "apps/deckcraft/src/main.rs"
find = "    if let Some(done) = craft_update::self_update::finish(&deckcraft_ui_egui::UPDATE_APP, &std::env::args_os().skip(1).collect::<Vec<_>>()) {\n        if let Err(e) = done {\n            eprintln!(\"DeckCraft update helper failed: {e}\");\n            std::process::exit(1);\n        }\n        return Ok(());\n    }\n"
replace = ""
count = 1

[[rule]]
why = "... nor upstream's description of its app for craft-update"
files = "crates/ui-egui/src/lib.rs"
find = '''(?s)/// DeckCraft as craft-update knows it.*?\n};\n\n'''
replace = ""
regex = true
count = 1

[[rule]]
why = "... and no craft-update dependency"
files = ["apps/deckcraft/Cargo.toml", "crates/ui-egui/Cargo.toml"]
find = "craft-update = { workspace = true }\n"
replace = ""
count = 2

[[rule]]
why = "... in the workspace either"
files = "Cargo.toml"
find = '^craft-update = \{ git = "https://github.com/storytold/craft-libs".*\n'
replace = ""
regex = true
count = 1

[[rule]]
why = "Windows packaging: a .NET namespace takes no space, so the app's display name cannot stand in for it"
files = "packaging/windows/package.ps1"
find = "Add-Type -Namespace DeckCraft -Name Shell"
replace = "Add-Type -Namespace FacthoryDeck -Name Shell"
count = 1

[[rule]]
why = "About: our logo (below) is an image, so the stroke and corner imports go"
files = "crates/ui-egui/src/dialogs/about.rs"
find = "use super::{Color32, CornerRadius, Rect, Sense, SlideApp, Stroke, Tokens, Ui, pos2, theme, vec2};"
replace = "use super::{Color32, Rect, Sense, SlideApp, Tokens, Ui, pos2, theme, vec2};"
count = 1

