[[rule]]
phase = "after"
why = "macOS: the Dock keeps the bundle's .icns (the icon on its tile); an empty icon stops eframe from setting the tile-less render or its default"
files = "apps/facthorydeck/src/main.rs"
find = '''fn app_icon() -> Option<egui::IconData> {
'''
