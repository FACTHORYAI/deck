# Crate, binary, file, directory and extension names: one lowercase word, so Rust identifiers
# (deckcraft_model -> facthorydeck_model), module paths and log targets stay consistent. The
# native format becomes .facthorydeck (its MIME type: the rule after the tokens).
[[token]]
from = "deckcraft"
to = "facthorydeck"

# ---------------------------------------------------------------------------------------------
# Windows Installer: our own UpgradeCode and component GUIDs, stable across releases.

[guids]
namespace = "https://facthory.com/deck/windows-installer"
# The installer's own policy check records the upgrade identity: the same GUIDs, mapped alike.
files = ["packaging/windows/*.wxs", "packaging/windows/install-policy.json"]

# ---------------------------------------------------------------------------------------------
# Rules after the tokens and renames: the credits, which name upstream on purpose, and ids the
# tokens cannot get right.

[[rule]]
phase = "after"
why = "The native format's MIME type: ours, not upstream's domain"
files = "crates/format/src/lib.rs"
find = 'pub const MIMETYPE: &str = "application/vnd.storyteller.facthorydeck+zip";'
replace = 'pub const MIMETYPE: &str = "application/vnd.facthory.deck+zip";'
count = 1

[[rule]]
phase = "after"
why = "About: what it is based on (brand licence: plain-text credit allowed)"
files = "crates/ui-egui/src/dialogs/about.rs"
find = 'ui.label("An open-source, clean-room project. Not affiliated with Microsoft.");'
replace = '''ui.label("An open-source, clean-room project. Not affiliated with Microsoft.");
        ui.label("Based on DeckCraft by the ArtCraft team.");'''
count = 1

[[rule]]
phase = "after"
why = "About: our copyright, then upstream's, which the licence requires us to keep"
files = "crates/ui-egui/src/dialogs/about.rs"
find = '"MIT OR Apache-2.0 · © 2026 ArtCraft Team and the Facthory Deck contributors"'
replace = '"MIT OR Apache-2.0 · © 2026 Bandpey GmbH · based on DeckCraft, © 2026 ArtCraft Team and the DeckCraft contributors"'
count = 1

[[rule]]
phase = "after"
why = "Windows file properties: our copyright and upstream's"
files = "apps/facthorydeck/build.rs"
find = '"Copyright (c) the Facthory Deck authors. MIT OR Apache-2.0."'
replace = '"Copyright (c) Bandpey GmbH; based on DeckCraft, copyright (c) the DeckCraft authors. MIT OR Apache-2.0."'
count = 1

[[rule]]
phase = "after"
why = "macOS Get Info: our copyright and upstream's"
files = "packaging/macos/Info.plist.in"
find = '<string>Copyright © the Facthory Deck authors. MIT OR Apache-2.0.</string>'
replace = '<string>Copyright © Bandpey GmbH; based on DeckCraft, copyright © the DeckCraft authors. MIT OR Apache-2.0.</string>'
count = 1

# The app icon is ours (derived from with icons, MIT): its attribution rows say so; upstream's icon
# source document is gone.
[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/icon-source\.deckcraft` \|.*\n'
replace = ''
regex = true
count = 1

[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/deckcraft-1024\.png`, `assets/app-icon/hicolor/\*/apps/ai\.storyteller\.deckcraft\.png` \|.*$'
replace = '| `assets/app-icon/facthorydeck-1024.png`, `assets/app-icon/hicolor/*/apps/com.facthory.deck.png` | with icons contributors; recoloured by Bandpey GmbH | `presentation` from with icons (Chrome style), recoloured (`facthory/icons/deck.svg`), rendered by `facthory/icons/render.py` | MIT | Facthory Deck app icon |'
regex = true
count = 1

[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/deckcraft\.icns`, `assets/app-icon/deckcraft\.ico` \|.*$'
replace = '| `assets/app-icon/facthorydeck.icns`, `assets/app-icon/facthorydeck.ico` | with icons contributors; recoloured by Bandpey GmbH | rendered from `facthory/icons/deck-macos.svg` (macOS) and `facthory/icons/deck.svg` (Windows) by `facthory/icons/render.py` | MIT | macOS and Windows app icons |'
regex = true
count = 1

[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/hicolor/scalable/apps/ai\.storyteller\.deckcraft\.svg` \|.*$'
replace = '| `assets/app-icon/hicolor/scalable/apps/com.facthory.deck.svg` | with icons contributors; recoloured by Bandpey GmbH | a copy of `facthory/icons/deck.svg` (`presentation` from with icons) | MIT | Scalable app icon for Linux desktops (hicolor theme) |'
regex = true
count = 1

[[rule]]
