# Facthory Deck: upstream DeckCraft (storytold/deckcraft) under the Facthory brand.
# Applied to a fresh checkout by facthory/rebrand.py before every build; the tracked tree stays
# upstream's so releases merge cleanly. Order and semantics: the docstring of rebrand.py.

[brand]
name = "Facthory Deck"
app_id = "com.facthory.deck"
publisher = "Bandpey GmbH"
website = "https://facthory.com/deck"
repository = "https://github.com/FACTHORYAI/deck"
support = "https://github.com/FACTHORYAI/deck/issues"

[upstream]
name = "DeckCraft"
team = "ArtCraft team"
repository = "https://github.com/storytold/deckcraft"

[icon]
svg = "deck.svg"
base = "facthorydeck"
# Upstream's assets/app-icon/ has neither <base>-macos-512.png nor <base>.svg.
macos_512 = false
svg_copy = false

# Facthory's other asset files, credited in ATTRIBUTION.md's Facthory block (render.py).
[[asset]]
path = "dmg/background.svg"
author = "@XusBadia (DeckCraft contributors); recoloured and retitled by Bandpey GmbH"
source = "derived from DeckCraft's `packaging/macos/dmg/background.svg`; title outlined from Inter SemiBold (OFL-1.1)"
licence = "MIT OR Apache-2.0"

[files]
# Names fixed inside binary fixtures, which the text naming them must keep matching: the test
# fonts' family names (crates/render/tests/fixtures/colr-squares.ttf,
# crates/fonts/tests/fixtures/legacy-*.ttf). Tests only.
keep = ["DeckCraft Colr Squares", "DeckCraft Legacy"]
# Never touched: upstream's licences and notices stay exactly as written (Apache-2.0 §4).
skip = ["LICENSE-APACHE", "LICENSE-MIT", "NOTICE", ".github"]
# Credit files. No token here applies to them (none is credits = true): contributors.json names
# upstream's repository on purpose, and ATTRIBUTION.md's icon rows are rewritten by the rules
# below, so every other credit stays exactly as upstream wrote it.
credits = ["ATTRIBUTION.md", "contributors"]
# The ArtCraft marks, licensed only for unmodified DeckCraft (docs/brand/LICENSE-brand.txt).
delete = ["docs/brand"]

# ---------------------------------------------------------------------------------------------
# Rules before the tokens, on upstream's text. Each fails the build when upstream moves it.

[[rule]]
why = "ProgIDs, the AppDir and other dotted names cannot take the space in the display name"
files = ["packaging/*", "apps/*"]
find = 'DeckCraft\.(?=[A-Z])'
replace = 'FacthoryDeck.'
regex = true

[[rule]]
why = "Info.plist keys that glue the name to a word"
files = "packaging/macos/Info.plist.in"
find = 'DeckCraft(?=Version|BuildCommit)'
replace = 'FacthoryDeck'
regex = true
count = 2

[[rule]]
why = "The ArtCraft Discord becomes our issue tracker: Help tab and About links"
files = ["crates/ui-egui/src/dialogs/about.rs", "crates/ui-egui/src/backstage/info.rs"]
find = 'ui.hyperlink_to("Join our community on Discord", '
replace = 'ui.hyperlink_to("Report a problem or ask for help", '
count = 2

[[rule]]
why = "File backstage: the ArtCraft community link"
files = "crates/ui-egui/src/backstage/files.rs"
find = 'ui.hyperlink_to("Join the ArtCraft community on Discord", '
replace = 'ui.hyperlink_to("Report a problem or ask for help", '
count = 1

[[rule]]
why = "CLI `links`: the Discord line is our issue tracker"
files = "apps/deckcraft-cli/src/main.rs"
find = 'outln!("Discord   {DISCORD}\nWebsite   {WEBSITE}\nApp page  {APP_PAGE}\nGitHub    {GITHUB}");'
replace = 'outln!("Support   {DISCORD}\nWebsite   {WEBSITE}\nApp page  {APP_PAGE}\nGitHub    {GITHUB}");'
count = 1

[[rule]]
files = "apps/deckcraft-cli/src/main.rs"
find = 'eprintln!("\nCommunity: {}  ·  {}", deckcraft_engine::links::DISCORD, deckcraft_engine::links::APP_PAGE);'
replace = 'eprintln!("\nHelp: {}  ·  {}", deckcraft_engine::links::DISCORD, deckcraft_engine::links::APP_PAGE);'
count = 1

[[rule]]
why = "MCP server instructions name the issue tracker, not Discord"
files = "crates/mcp/src/server.rs"
find = 'Community: {} (Discord), {} (app page), {} (source).'
replace = 'Support: {} (issues), {} (app page), {} (source).'
count = 1

[[rule]]
why = "Upstream's mark painted in code (About, Start screen, Account page) becomes our app icon"
files = "crates/ui-egui/src/dialogs/about.rs"
find = '''(?s)/// DeckCraft's mark, drawn in code: a slide card with a play triangle in our orange\.\npub fn paint_logo\(p: &egui::Painter, r: Rect\) \{\n.*?\n\}\n'''
replace = '''/// Facthory Deck's mark, drawn in code: the app icon (facthory/icons/deck.svg) on its 512 grid.
pub fn paint_logo(p: &egui::Painter, r: Rect) {
    let slate = Color32::from_rgb(0x1E, 0x2A, 0x38);
    let paper = Color32::from_rgb(0xF4, 0xF1, 0xEA);
    let amber = Color32::from_rgb(0xF2, 0xB3, 0x3D);
    let u = r.width() / 512.0;
    let at = |x: f32, y: f32, w: f32, h: f32| Rect::from_min_size(pos2(r.min.x + x * u, r.min.y + y * u), vec2(w * u, h * u));
    let round = |radius: f32| CornerRadius::same((radius * u) as u8);
    p.rect_filled(r, round(112.0), slate);
    p.rect_filled(at(80.0, 112.0, 352.0, 240.0), round(18.0), paper);
    p.rect_filled(at(244.0, 352.0, 24.0, 48.0), CornerRadius::ZERO, paper);
    p.rect_filled(at(176.0, 392.0, 160.0, 24.0), round(12.0), paper);
    p.rect_filled(at(128.0, 148.0, 128.0, 20.0), round(10.0), slate);
    for (x, y, h) in [(136.0, 252.0, 68.0), (228.0, 212.0, 108.0), (320.0, 168.0, 152.0)] {
        p.rect_filled(at(x, y, 56.0, h), round(6.0), amber);
    }
}
'''
regex = true
count = 1

[[rule]]
why = "Windows: the installer's suite folder (Programs\\ArtCraft\\<app>, Program Files\\ArtCraft\\<app>) is ours, and the installer's own policy check expects the same name"
files = ["packaging/windows/*.wxs", "packaging/windows/*.wxi", "packaging/windows/*.ps1", "packaging/windows/*.md"]
find = "ArtCraft"
replace = "Facthory"

# Upstream's own updater (craft-update, from craft-libs) checks and installs the upstream apps'
# releases, by their repositories and ai.storyteller.* ids, and carries their names into the binary.
# It is left out: facthory/update/ is the updater that runs, and facthory/update/updates_ui.rs
# stands in for upstream's update window ([[copy]] below).

[[rule]]
why = "No self-update helper of upstream's flow at start"
files = "apps/deckcraft/src/main.rs"
find = "    if let Some(done) = craft_update::self_update::finish(&craft_update::suite::DECKCRAFT, &std::env::args_os().skip(1).collect::<Vec<_>>()) {\n        if let Err(e) = done {\n            eprintln!(\"DeckCraft update helper failed: {e}\");\n            std::process::exit(1);\n        }\n        return Ok(());\n    }\n"
replace = ""
count = 1

[[rule]]
why = "... and no craft-update dependency"
files = ["apps/deckcraft/Cargo.toml", "crates/ui-egui/Cargo.toml"]
find = "craft-update = { workspace = true }\n"
replace = ""
count = 2

[[rule]]
why = "... in the workspace either"
files = "Cargo.toml"
find = '^craft-update = \{ git = "https://github.com/storytold/craft-libs".*\n'
replace = ""
regex = true
count = 1

# ---------------------------------------------------------------------------------------------
# Tokens, in order, over every text file except the skipped and credit files.

[[token]]
from = "ai.storyteller.deckcraft"
to = "com.facthory.deck"

[[token]]
from = "ai.storyteller"
to = "com.facthory"

[[token]]
from = "deckcraft@storyteller.ai"
to = "support@facthory.com"

[[token]]
from = "https://getartcraft.com/apps/deckcraft"
to = "https://facthory.com/deck"

[[token]]
from = "getartcraft.com/apps/deckcraft"
to = "facthory.com/deck"

# links::APPS: Facthory has no apps index page; the website stands in.
[[token]]
from = "https://getartcraft.com/apps"
to = "https://facthory.com/"

[[token]]
from = "https://getartcraft.com/"
to = "https://facthory.com/"

[[token]]
from = "https://discord.gg/artcraft"
to = "https://github.com/FACTHORYAI/deck/issues"

[[token]]
from = "discord.gg/artcraft"
to = "github.com/FACTHORYAI/deck/issues"

[[token]]
from = "github.com/storytold/deckcraft"
to = "github.com/FACTHORYAI/deck"

[[token]]
from = "storytold/deckcraft"
to = "FACTHORYAI/deck"

[[token]]
from = "Learning Machines LLC"
to = "Bandpey GmbH"

[[token]]
from = "DECKCRAFT"
to = "FACTHORY_DECK"

[[token]]
from = "DeckCraft"
to = "Facthory Deck"

[[token]]
from = "Deckcraft"
to = "FacthoryDeck"

# Crate, binary, file, directory and extension names: one lowercase word, so Rust identifiers
# (deckcraft_model -> facthorydeck_model), module paths and log targets stay consistent. The
# native format becomes .facthorydeck (its MIME type: the rule after the tokens).
[[token]]
from = "deckcraft"
to = "facthorydeck"

# ---------------------------------------------------------------------------------------------
# Windows Installer: our own UpgradeCode and component GUIDs, stable across releases.

[guids]
namespace = "https://facthory.com/deck/windows-installer"
files = ["packaging/windows/*.wxs"]

# ---------------------------------------------------------------------------------------------
# Rules after the tokens and renames: the credits, which name upstream on purpose, and ids the
# tokens cannot get right.

[[rule]]
phase = "after"
why = "The native format's MIME type: ours, not upstream's domain"
files = "crates/format/src/lib.rs"
find = 'pub const MIMETYPE: &str = "application/vnd.storyteller.facthorydeck+zip";'
replace = 'pub const MIMETYPE: &str = "application/vnd.facthory.deck+zip";'
count = 1

[[rule]]
phase = "after"
why = "About: what it is based on (brand licence: plain-text credit allowed)"
files = "crates/ui-egui/src/dialogs/about.rs"
find = 'ui.label("An open-source, clean-room project. Not affiliated with Microsoft.");'
replace = '''ui.label("An open-source, clean-room project. Not affiliated with Microsoft.");
        ui.label("Based on DeckCraft by the ArtCraft team.");'''
count = 1

[[rule]]
phase = "after"
why = "About: our copyright, then upstream's, which the licence requires us to keep"
files = "crates/ui-egui/src/dialogs/about.rs"
find = '"MIT OR Apache-2.0 · © 2026 ArtCraft Team and the Facthory Deck contributors"'
replace = '"MIT OR Apache-2.0 · © 2026 Bandpey GmbH · based on DeckCraft, © 2026 ArtCraft Team and the DeckCraft contributors"'
count = 1

[[rule]]
phase = "after"
why = "Windows file properties: our copyright and upstream's"
files = "apps/facthorydeck/build.rs"
find = '"Copyright (c) the Facthory Deck authors. MIT OR Apache-2.0."'
replace = '"Copyright (c) Bandpey GmbH; based on DeckCraft, copyright (c) the DeckCraft authors. MIT OR Apache-2.0."'
count = 1

[[rule]]
phase = "after"
why = "macOS Get Info: our copyright and upstream's"
files = "packaging/macos/Info.plist.in"
find = '<string>Copyright © the Facthory Deck authors. MIT OR Apache-2.0.</string>'
replace = '<string>Copyright © Bandpey GmbH; based on DeckCraft, copyright © the DeckCraft authors. MIT OR Apache-2.0.</string>'
count = 1

# The app icon is ours: its attribution rows say so; upstream's icon source document is gone.
[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/icon-source\.deckcraft` \|.*\n'
replace = ''
regex = true
count = 1

[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/deckcraft-1024\.png`, `assets/app-icon/hicolor/\*/apps/ai\.storyteller\.deckcraft\.png` \|.*$'
replace = '| `assets/app-icon/facthorydeck-1024.png`, `assets/app-icon/hicolor/*/apps/com.facthory.deck.png` | Bandpey GmbH | original artwork (`facthory/icons/deck.svg`), rendered by `facthory/icons/render.py` | MIT OR Apache-2.0 | Facthory Deck app icon |'
regex = true
count = 1

[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/deckcraft\.icns`, `assets/app-icon/deckcraft\.ico` \|.*$'
replace = '| `assets/app-icon/facthorydeck.icns`, `assets/app-icon/facthorydeck.ico` | Bandpey GmbH | rendered from `facthory/icons/deck.svg` by `facthory/icons/render.py` | MIT OR Apache-2.0 | macOS and Windows app icons |'
regex = true
count = 1

[[rule]]
phase = "after"
files = "ATTRIBUTION.md"
find = '^\| `assets/app-icon/hicolor/scalable/apps/ai\.storyteller\.deckcraft\.svg` \|.*$'
replace = '| `assets/app-icon/hicolor/scalable/apps/com.facthory.deck.svg` | Bandpey GmbH | original artwork, a copy of `facthory/icons/deck.svg` | MIT OR Apache-2.0 | Scalable app icon for Linux desktops (hicolor theme) |'
regex = true
count = 1

# The updater (facthory/update/facthory_update.rs, copied below): its module and its calls from
# main.rs. It needs no dependency the app lacks.
[[rule]]
phase = "after"
why = "The updater's module"
files = "apps/facthorydeck/src/main.rs"
find = "mod control_server;\n"
replace = "mod control_server;\nmod facthory_update;\n"
count = 1

[[rule]]
phase = "after"
why = "The updater starts with the window, in runs that keep preferences"
files = "apps/facthorydeck/src/main.rs"
find = "            load_prefs(&mut app);\n"
replace = "            load_prefs(&mut app);\n            facthory_update::start(\"Facthory Deck\", config_dir().filter(|_| std::env::var_os(\"FACTHORY_DECK_NO_PREFS\").is_none()));\n"
count = 1

[[rule]]
phase = "after"
why = "The updater's notice"
files = "apps/facthorydeck/src/main.rs"
find = "        self.0.ui(ui);\n"
replace = "        self.0.ui(ui);\n        facthory_update::ui(ui.ctx());\n"
count = 1

[[rule]]
phase = "after"
why = "A downloaded update installs as the app quits (on_exit runs on every way of quitting)"
files = "apps/facthorydeck/src/main.rs"
find = "        save_prefs(&self.0);\n"
replace = "        save_prefs(&self.0);\n        facthory_update::on_exit();\n"
count = 1

# ---------------------------------------------------------------------------------------------

[[copy]]
# Upstream's update window, without its updater (facthory/update/updates_ui.rs).
from = "update/updates_ui.rs"
to = "crates/ui-egui/src/dialogs/updates_ui.rs"

[[copy]]
from = "update/facthory_update.rs"
to = "apps/facthorydeck/src/facthory_update.rs"

[[copy]]
from = "icons/app-icon"
to = "assets/app-icon"
replace = true

[[copy]]
# The DMG window: our colours, title and icon (the release workflow renders it with generate.py).
from = "dmg/background.svg"
to = "packaging/macos/dmg/background.svg"

[[copy]]
# Packages carry README.md (packaging copy_docs): ours, not upstream's.
from = "../.github/README.md"
to = "README.md"

# ---------------------------------------------------------------------------------------------
# `rebrand.py check`: no upstream mark in what ships, except the credits above.

[check]
paths = ["packaging", "assets", "apps/*/build.rs", "apps/*/index.html", "Cargo.toml"]
# Developer notes and scripts under packaging/ do not ship.
exclude = ["*/tests/*", "*.png", "*.ico", "*.icns", "*.tiff", "*.md", "*.py"]
# These also keep upstream's updater out: its feeds are its repositories (storytold/<app>) and
# its ids ai.storyteller.<app>, and it names the ArtCraft Launcher, so a build that links it
# again fails here (it did: craft-update, upstream releases of 2026-10).
forbid = [
  "artcraft", "deckcraft", "storytold", "storyteller", "getartcraft", "learning machines",
  "crafting apps", "photocraft", "vectorcraft", "filmcraft", "lightcraft", "pdfcraft",
  "effectcraft", "designcraft", "gridcraft", "wordcraft",
]
allow = [
  'Based on DeckCraft by the ArtCraft team.',
  'based on DeckCraft, © 2026 ArtCraft Team and the DeckCraft contributors',
  'based on DeckCraft, copyright (c) the DeckCraft authors.',
  'based on DeckCraft, copyright © the DeckCraft authors.',
  # Files from before upstream's SlideCraft -> DeckCraft rename still open (crates/format): a
  # format identifier the app reads, never shows or writes.
  'application/vnd.storyteller.slidecraft+zip',
  # Provenance of the media codecs, in a Cargo.toml comment (upstream's same-owner sibling).
  'ported from FilmCraft, same owner and licence',
  # Build inputs used unmodified (Cargo git dependencies), not a product surface.
  'https://github.com/storytold/craft-libs',
  # Upstream's forks of egui and winit (Cargo git dependencies), and the translations the
  # Flatpak recipe checks out: build inputs used unmodified.
  'https://github.com/storytold/egui.git',
  'https://github.com/storytold/winit.git',
  'https://github.com/storytold/craft-i18n',
  # The installer's policy check, shared by upstream's apps, names its siblings' ids (build time).
  "$policy.id -in 'facthorydeck','filmcraft','soundcraft'",
]

# ---------------------------------------------------------------------------------------------
# facthory/sync.py: upstream files the patch set removed stay removed when a merge changes them.

[sync]
removed = [".github/dependabot.yml"]
