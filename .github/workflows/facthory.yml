name: Facthory Deck

# The product build: upstream's tree with the Facthory brand applied (facthory/rebrand.py), then
# upstream's own quality gate on the branded tree, a release build, and the check that no
# upstream mark is left in what ships. Upstream's ci.yml keeps gating the unbranded tree; this
# job mirrors its setup.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: facthory-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Same craft-fonts commit as upstream's ci.yml and release.yml; bumped with upstream syncs.
  CRAFT_FONTS_REF: 37827adc41fd165f9a9234ac40f94dbad353aa69

jobs:
  branded:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out craft-fonts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: ${{ env.CRAFT_FONTS_REF }}
          path: craft-fonts
          persist-credentials: false
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: facthory-ubuntu-latest
      - name: Apply the Facthory brand
        run: |
          python3 facthory/rebrand.py apply
          cargo fmt --all
      - name: cargo xtask ci (branded)
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo xtask ci
      - name: Release build
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: cargo build --release --locked -p facthorydeck -p facthorydeck-cli
      - name: No upstream mark in what ships
        run: python3 facthory/rebrand.py check target/release/facthorydeck target/release/facthorydeck-cli
